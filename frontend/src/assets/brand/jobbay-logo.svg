<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="JobBay">
  <defs>
    <linearGradient id="jbTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f75"/>
      <stop offset="0.55" stop-color="#0c3060"/>
      <stop offset="1" stop-color="#0a5b6b"/>
    </linearGradient>
    <linearGradient id="jbShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jbJ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef2d6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="jbDot" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffd166"/>
