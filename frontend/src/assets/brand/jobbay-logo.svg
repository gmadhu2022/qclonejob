  <rect x=".75" y=".75" width="118.5" height="118.5" rx="27.3" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.5"/>
  <circle cx="51" cy="67" r="13" fill="#ffb020" opacity=".45" filter="url(#jbGlow)"/>
  <path d="M75 25 V65 A24 24 0 0 1 27 65 V61" fill="none" stroke="url(#jbJ)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="51" cy="67" r="10" fill="url(#jbDot)"/>
  <text x="146" y="88" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="88" letter-spacing="-2"><tspan fill="#0b2350">Job</tspan><tspan fill="url(#jbBay)">Bay</tspan></text>
